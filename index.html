<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Sticky Frog</title>
<link rel="icon" href="data:," />
<link rel="preload" href="./fonts/baloo2-extrabold-latin.woff2" as="font" type="font/woff2" crossorigin />
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
/* Design system: _out/hook-hero/round2/ui/DESIGN.md (direction A, soft vinyl toy). Font: Baloo 2 ExtraBold, OFL (public/fonts/OFL-Baloo2.txt). */
@font-face { font-family: 'Baloo SF'; src: url('./fonts/baloo2-extrabold-latin.woff2') format('woff2'); font-weight: 800; font-display: block; }
:root {
  --font: 'Baloo SF', 'Arial Rounded MT Bold', 'Arial Black', system-ui, sans-serif;
  --go: #3fe07c; --go-hi: #8af5b0; --go-lo: #22c463; --go-deep: #139a4c;
  --sun: #ffd23f; --sun-hi: #fff2a6; --sun-lo: #ffbf1f; --sun-deep: #d68a00;
  --milk: #fffaf2; --milk-hi: #ffffff; --milk-lo: #f1e9f5; --milk-deep: #cbbfd9;
  --berry: #ff4f86; --berry-hi: #ff9cbc; --berry-lo: #f2306f; --berry-deep: #b5174e;
  --lock: #d4cee0; --lock-deep: #a198b6; --ink-soft: #2a2340;
  --spring: cubic-bezier(.34, 1.8, .5, 1); --settle: cubic-bezier(.2, .8, .2, 1); --deflate: cubic-bezier(.5, 0, .9, .4);
  --w-deep: #0f6b55; --w-tint: #e9fff1; --w-glass: rgba(220, 255, 240, .38); --w-accent: #ff5fa8;
  --safe-t: max(12px, env(safe-area-inset-top)); --safe-l: max(14px, env(safe-area-inset-left)); --safe-r: max(14px, env(safe-area-inset-right)); --safe-b: max(12px, env(safe-area-inset-bottom));
}
body[data-world="1"] { --w-deep: #b02a74; --w-tint: #fff0f8; --w-glass: rgba(255, 230, 245, .42); --w-accent: #7be0ff; }
body[data-world="2"] { --w-deep: #2a1458; --w-tint: #f1ecff; --w-glass: rgba(150, 130, 230, .34); --w-accent: #00f0ff; }
body[data-world="3"] { --w-deep: #5a1a1a; --w-tint: #fff3e6; --w-glass: rgba(90, 30, 20, .30); --w-accent: #ffb020; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #a8e6ff; font-family: var(--font); font-weight: 800; color: #fff;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
svg.i { width: 1em; height: 1em; display: inline-block; vertical-align: -.14em; flex: none; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.ov { position: fixed; inset: 0; pointer-events: none; }
#vignette { background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 20, 30, .32) 100%); }
#flash { background: #fff; opacity: 0; z-index: 60; }
#frost { display: none; background: rgba(255, 255, 255, .06); -webkit-backdrop-filter: blur(4px) saturate(1.1); backdrop-filter: blur(4px) saturate(1.1); }
body[data-screen="menu"] #frost, body[data-screen="levels"] #frost, body[data-screen="shop"] #frost, body[data-screen="records"] #frost { display: block; }
.tx { color: #fff; paint-order: stroke fill; -webkit-text-stroke: 7px var(--w-deep); text-shadow: 0 4px 0 var(--w-deep); letter-spacing: .5px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- vinyl buttons: Gumdrop (.go) / Milk (default) / Sunny (.sun) / Berry ---------- */
.b { --base: var(--milk); --hi: var(--milk-hi); --lo: var(--milk-lo); --deep: var(--milk-deep); --fg: var(--w-deep); --th: 6px;
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .4em; white-space: nowrap;
  min-height: 56px; padding: 0 26px; border-radius: 999px; font-size: 22px; line-height: 1; color: var(--fg); letter-spacing: .5px;
  background: linear-gradient(var(--hi), var(--base) 52%, var(--lo));
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.4), inset 0 -5px 0 rgba(0,0,0,.07), 0 var(--th) 0 var(--deep), 0 calc(var(--th) + 8px) 16px rgba(20, 30, 50, .22);
  transition: transform .12s var(--settle), box-shadow .07s; }
.b::before { content: ''; position: absolute; left: 9%; right: 9%; top: 7%; height: 40%; border-radius: 999px; pointer-events: none;
  background: linear-gradient(rgba(255,255,255,.85), rgba(255,255,255,0)); opacity: .55; transition: opacity .12s; }
.b > * { position: relative; }
.b.go { --base: var(--go); --hi: var(--go-hi); --lo: var(--go-lo); --deep: var(--go-deep); --fg: #fff; --th: 8px; min-height: 76px; font-size: 36px; padding: 0 46px; text-shadow: 0 3px 0 var(--go-deep); }
.b.sun { --base: var(--sun); --hi: var(--sun-hi); --lo: var(--sun-lo); --deep: var(--sun-deep); --fg: var(--ink-soft); }
.b.berry { --base: var(--berry); --hi: var(--berry-hi); --lo: var(--berry-lo); --deep: var(--berry-deep); --fg: #fff; }
.b.go::after, .b.sun::after { content: ''; position: absolute; left: 15px; top: 11px; width: 22px; height: 16px; pointer-events: none;
  background: radial-gradient(circle at 5px 5px, #fff 0 4.5px, transparent 5.5px), radial-gradient(circle at 15px 11px, #fff 0 2.4px, transparent 3.2px); opacity: .9; }
.b.locked { --base: var(--lock); --hi: #e6e1ef; --lo: var(--lock); --deep: var(--lock-deep); --fg: rgba(60, 50, 90, .55); }
.b.locked::before { opacity: 0; }
.b.badge::after { content: ''; position: absolute; top: -6px; right: -4px; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffb3cb, var(--berry) 60%);
  box-shadow: 0 3px 0 var(--berry-deep), inset 0 0 0 2px rgba(255,255,255,.5); animation: dotPulse 1.6s ease-in-out infinite; }
@keyframes dotPulse { 0%, 70%, 100% { transform: scale(1); } 80% { transform: scale(1.25, .85); } 90% { transform: scale(.92, 1.08); } }
@media (hover: hover) { .b:hover:not(.locked) { transform: translateY(-2px); } .b:hover::before { opacity: .85; } }
.b.down { --th: 2px; transform: translateY(4px) scale(1.06, .9); transition: transform .07s cubic-bezier(.3,0,.6,1), box-shadow .07s; }
.b.locked.down { transform: scale(.97); --th: 6px; }
.b.down, .card.down, .bub.down, .lvb.down, .wcard.down { animation: none !important; }
.b.rel, .card.rel, .lvb.rel, .wcard.rel { animation: rel .32s var(--settle) !important; }
@keyframes rel { 0% { transform: translateY(4px) scale(1.06, .9); } 40% { transform: translateY(-3px) scale(.95, 1.06); } 72% { transform: translateY(0) scale(1.015, .99); } 100% { transform: none; } }
.b:focus-visible, .bub:focus-visible, .card:focus-visible, .lvb:focus-visible, .wcard:focus-visible { outline: none; box-shadow: 0 0 0 3px #fff, 0 0 0 8px var(--w-accent); }

/* bubble (glass, tier 3) */
.bub { position: relative; width: 52px; height: 52px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 24px; color: #fff; flex: none;
  background: radial-gradient(circle at 50% 120%, rgba(255,255,255,.35), transparent 60%), var(--w-glass);
  -webkit-backdrop-filter: blur(8px) saturate(1.4); backdrop-filter: blur(8px) saturate(1.4);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.75), inset 0 -6px 10px rgba(255,255,255,.2), 0 6px 16px rgba(10, 30, 50, .2); transition: transform .12s var(--settle); }
.bub::before { content: ''; position: absolute; left: 10px; top: 8px; width: 18px; height: 14px; background: radial-gradient(circle at 5px 5px, #fff 0 4px, transparent 5px), radial-gradient(circle at 13px 10px, #fff 0 2px, transparent 3px); }
.bub::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; }
.bub svg { filter: drop-shadow(0 2px 0 var(--w-deep)); }
.bub.solid { background: radial-gradient(circle at 50% 0%, rgba(255,255,255,.25), transparent 60%), var(--w-deep); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35), 0 4px 0 rgba(0,0,0,.2); }
.bub.off { opacity: .55; }
.bub .slash { display: none; position: absolute; width: 30px; height: 4px; border-radius: 2px; background: #fff; transform: rotate(-45deg); box-shadow: 0 0 0 2px var(--w-deep); }
.bub.off .slash { display: block; }
@media (hover: hover) { .bub:hover { transform: translateY(-2px) scale(1.05); } }
.bub.down { transform: scale(1.1, .86); transition-duration: .07s; }
.bub.rel { animation: relB .3s var(--settle); }
@keyframes relB { 0% { transform: scale(1.1, .86); } 45% { transform: scale(.94, 1.08); } 100% { transform: none; } }

.cap { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 16px 0 8px; border-radius: 999px; font-size: 26px;
  background: var(--w-glass); -webkit-backdrop-filter: blur(8px) saturate(1.4); backdrop-filter: blur(8px) saturate(1.4);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.75), 0 6px 16px rgba(10, 30, 50, .18); }
.cap .i { font-size: 34px; }
.bump { animation: bump .22s var(--settle); }
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.14, .88); } 70% { transform: scale(.96, 1.05); } 100% { transform: none; } }

/* ---------- screens ---------- */
.screen { position: fixed; inset: 0; display: none; pointer-events: auto; }
.screen.on { display: block; }
.topbar { position: absolute; left: var(--safe-l); right: var(--safe-r); top: var(--safe-t); display: flex; align-items: center; gap: 12px; z-index: 3; }
.topbar .sp { flex: 1; }
.ttl { font-size: 38px; white-space: nowrap; }
.drop { animation: drop .46s var(--spring) both; }
@keyframes drop { 0% { transform: translateY(-40px) scale(.9); opacity: 0; } 55% { transform: translateY(4px) scale(1.05, .94); opacity: 1; } 80% { transform: translateY(-1px) scale(.99, 1.01); } 100% { transform: none; opacity: 1; } }
.row { display: flex; gap: 14px; flex-wrap: nowrap; justify-content: center; }

/* MENU */
#menu .wrap { position: absolute; inset: 0; display: grid; grid-template-columns: 1.08fr .92fr; align-items: center; padding: 70px 5vw 40px; gap: 2vw; }
#menu .col { display: flex; flex-direction: column; align-items: center; gap: 18px; }
#logo { display: flex; flex-direction: column; align-items: center; line-height: .86; font-size: clamp(56px, 8.4vw, 112px); animation: breathe 4s ease-in-out infinite; transform-origin: 50% 90%; margin-bottom: 6px; }
#logo .w { display: flex; }
#logo .w2 { margin-top: -.06em; margin-left: .7em; }
.lt { position: relative; display: inline-block; color: transparent; padding: 0 .015em; }
.lt::before, .lt::after { content: attr(data-l); position: absolute; left: 0; top: 0; padding: 0 .015em; }
.lt::before { color: var(--w-deep); -webkit-text-stroke: .15em var(--w-deep); text-shadow: 0 .09em 0 var(--w-deep), 0 .16em .18em rgba(10, 30, 40, .3); }
.lt::after { color: transparent; -webkit-background-clip: text; background-clip: text; background-image: linear-gradient(rgba(255,255,255,.9) 0 14%, rgba(255,255,255,0) 34%), var(--fill); }
.w1 .lt { --fill: linear-gradient(#fff3a8, #ffd23f 48%, #ffae12); }
.w2 .lt { --fill: linear-gradient(#a6ffc6, #3fe07c 48%, #17b45a); }
.lt:nth-child(odd) { transform: rotate(-4deg) translateY(.02em); } .lt:nth-child(even) { transform: rotate(3deg); }
@keyframes breathe { 0%, 80%, 100% { transform: scale(1); } 88% { transform: scale(1.035, .975); } 94% { transform: scale(.99, 1.015); } }
#nextUp { min-height: 64px; padding: 6px 22px 6px 8px; gap: 12px; font-size: 21px; text-align: left; animation: nudge 3.2s ease-in-out 1.2s infinite; max-width: 100%; }
#nextUp .pp { width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff, #ffe9a6); box-shadow: inset 0 0 0 2px rgba(255,255,255,.8), 0 2px 0 var(--sun-deep); overflow: hidden; flex: none; display: grid; place-items: center; font-size: 28px; color: var(--sun-deep); }
#nextUp .pp img { width: 116%; margin-top: -2px; }
#nextUp .t { min-width: 0; }
#nextUp small { display: block; font-size: 14px; opacity: .72; margin-top: 3px; letter-spacing: 0; white-space: nowrap; }
#nextUp .arr { font-size: 22px; margin-left: 4px; }
@keyframes nudge { 0%, 84%, 100% { transform: none; } 88% { transform: translateY(-4px) scale(1.03, .97); } 93% { transform: translateY(1px) scale(.99, 1.02); } }
#playBtn { min-width: 300px; animation: breathe 3s ease-in-out .6s infinite; }
#playBtn .i { font-size: 30px; filter: drop-shadow(0 3px 0 var(--go-deep)); }
#endlessBtn .i { font-size: 18px; }
.hero { position: relative; display: grid; justify-items: center; align-self: end; margin-bottom: 4vh; }
.hero .pad { position: absolute; bottom: 34px; width: 92%; height: 70px; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 30%, #8af5b0, #2fcf6c 55%, #1a9c50); box-shadow: 0 10px 0 #12804a, 0 22px 30px rgba(10, 40, 30, .3), inset 0 4px 0 rgba(255,255,255,.5); }
.hero img { position: relative; width: min(34vw, 380px); aspect-ratio: 1; margin-bottom: 30px; animation: idle 2.6s ease-in-out infinite; transform-origin: 50% 88%; filter: drop-shadow(0 8px 6px rgba(0, 40, 20, .25)); pointer-events: none; }
@keyframes idle { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025, .975); } }
.hero .tag { position: relative; min-height: 46px; font-size: 18px; padding: 0 18px; margin-top: -8px; }
.hero .tag small { font-size: 13px; opacity: .65; margin-left: 4px; }
#menu .toggles { position: absolute; left: var(--safe-l); bottom: var(--safe-b); display: flex; gap: 10px; }

/* LEVELS */
.lvBody { position: absolute; left: var(--safe-l); right: var(--safe-r); top: 84px; bottom: 16px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
#worldTabs { display: grid; grid-template-columns: repeat(4, minmax(0, 190px)); gap: 14px; width: 100%; justify-content: center; }
.wcard { position: relative; height: 96px; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; padding: 10px 14px; text-align: left;
  background: linear-gradient(var(--s0), var(--s1)); box-shadow: inset 0 0 0 3px rgba(255,255,255,.75), 0 6px 0 rgba(0,0,0,.18), 0 12px 18px rgba(10, 30, 50, .2); transition: transform .14s var(--settle); }
.wcard::before { content: ''; position: absolute; left: 8%; right: 8%; top: 6px; height: 30%; border-radius: 999px; background: linear-gradient(rgba(255,255,255,.6), rgba(255,255,255,0)); }
.wcard .wn { position: relative; font-size: 20px; color: #fff; paint-order: stroke fill; -webkit-text-stroke: 6px var(--d); text-shadow: 0 3px 0 var(--d); }
.wcard .wp { position: relative; font-size: 13px; color: #fff; opacity: .95; paint-order: stroke fill; -webkit-text-stroke: 4px var(--d); }
.wcard .blob { position: absolute; right: -10px; top: -8px; width: 70px; height: 70px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--p) 45%); opacity: .9; }
.wcard.on { transform: translateY(-6px) scale(1.04); box-shadow: inset 0 0 0 4px #fff, 0 0 0 4px var(--sun), 0 10px 0 rgba(0,0,0,.18), 0 16px 22px rgba(10, 30, 50, .25); }
.wcard.locked { filter: saturate(.25) brightness(1.05); }
.wcard.locked .blob { display: none; }
.wcard .lk { position: absolute; right: 12px; top: 12px; font-size: 24px; color: #fff; }
#levelGrid { display: grid; grid-template-columns: repeat(5, 84px); gap: 16px 22px; justify-content: center; align-content: start; padding-top: 6px; }
.lvb { position: relative; width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; color: #fff;
  background: radial-gradient(circle at 50% 30%, var(--go-hi), var(--go) 55%, var(--go-lo)); box-shadow: inset 0 0 0 2px rgba(255,255,255,.45), 0 6px 0 var(--go-deep), 0 12px 14px rgba(10, 30, 50, .2); text-shadow: 0 3px 0 var(--go-deep); transition: transform .12s var(--settle); }
.lvb::before { content: ''; position: absolute; left: 18px; top: 10px; width: 22px; height: 16px; background: radial-gradient(circle at 5px 5px, #fff 0 4.5px, transparent 5.5px), radial-gradient(circle at 15px 11px, #fff 0 2.2px, transparent 3px); }
.lvb.cur { background: radial-gradient(circle at 50% 30%, var(--sun-hi), var(--sun) 55%, var(--sun-lo)); color: var(--ink-soft); text-shadow: none; box-shadow: inset 0 0 0 2px rgba(255,255,255,.6), 0 6px 0 var(--sun-deep), 0 0 0 6px rgba(255, 255, 255, .55), 0 12px 14px rgba(10, 30, 50, .2); animation: breathe 2.2s ease-in-out infinite; }
.lvb.locked { background: radial-gradient(circle at 50% 30%, #eeeaf4, var(--lock)); box-shadow: inset 0 0 0 2px rgba(255,255,255,.5), 0 5px 0 var(--lock-deep); color: rgba(60, 50, 90, .45); text-shadow: none; cursor: default; font-size: 24px; }
.lvb.locked::before { display: none; }
@media (hover: hover) { .lvb:not(.locked):hover, .wcard:not(.locked):hover { transform: translateY(-3px); } }
.lvb.down { transform: translateY(3px) scale(1.08, .9); }

/* SHOP */
#shop .body { position: absolute; left: var(--safe-l); right: var(--safe-r); top: 82px; bottom: 16px; display: grid; grid-template-columns: 360px 1fr; gap: 22px; }
.show { position: relative; border-radius: 30px; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: 16px 18px 20px; color: var(--ink-soft);
  background: radial-gradient(ellipse at 50% 34%, #fff7d6 0, #ffe7a3 38%, #ffc46b 100%);
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.7), inset 0 -8px 0 rgba(200, 110, 0, .12), 0 8px 0 var(--sun-deep), 0 18px 28px rgba(60, 30, 0, .25); }
.show::before { content: ''; position: absolute; inset: 0; background: repeating-conic-gradient(from 0deg at 50% 36%, rgba(255,255,255,.28) 0 10deg, transparent 10deg 20deg); animation: rays 24s linear infinite; }
@keyframes rays { to { transform: rotate(360deg); } }
.show > * { position: relative; }
.ribbon { align-self: flex-start; display: inline-flex; gap: 6px; align-items: center; height: 32px; padding: 0 14px; border-radius: 999px; font-size: 16px; color: #fff;
  background: linear-gradient(var(--berry-hi), var(--berry) 55%); box-shadow: 0 3px 0 var(--berry-deep), inset 0 0 0 2px rgba(255,255,255,.4); }
.spin { width: 230px; height: 230px; margin: 2px 0 -8px; background: url('./ui/cat-turn.webp') 0 0 / 1600% 100% no-repeat; animation: turn 2.4s steps(16) infinite; }
@keyframes turn { to { background-position: 100% 0; } }
.pedestal { width: 210px; height: 36px; border-radius: 50%; background: radial-gradient(ellipse at 50% 30%, #fff, #ffd9a0 70%); box-shadow: 0 6px 0 #e8a24a, 0 14px 18px rgba(80, 40, 0, .25); margin-top: -14px; }
.show h2 { font-size: 34px; margin-top: 12px; color: var(--ink-soft); white-space: nowrap; }
.show .sub { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; margin-top: 2px; padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,.7); white-space: nowrap; }
.show .sub i { width: 26px; height: 8px; border-radius: 4px; background: repeating-linear-gradient(60deg, #ff7ab8 0 5px, #ffd0e8 5px 9px); }
.show .buy { margin-top: auto; width: 100%; min-height: 62px; font-size: 26px; }
.show .buy.owned { --base: var(--go); --hi: var(--go-hi); --lo: var(--go-lo); --deep: var(--go-deep); --fg: #fff; }
.show .buy.afford, .card.afford { animation: breatheCard 2.4s ease-in-out infinite; }
@keyframes breatheCard { 0%, 70%, 100% { transform: none; } 80% { transform: translateY(-4px) scale(1.03, .98); } 90% { transform: scale(.99, 1.01); } }
.side { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.tabs { display: flex; gap: 10px; margin-bottom: 14px; }
.tab { min-height: 50px; font-size: 19px; padding: 0 20px; }
.tab.on { --base: var(--sun); --hi: var(--sun-hi); --lo: var(--sun-lo); --deep: var(--sun-deep); --fg: var(--ink-soft); }
#cards { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; padding: 4px 6px 30px; align-content: start;
  -webkit-mask-image: linear-gradient(#000 calc(100% - 30px), transparent); mask-image: linear-gradient(#000 calc(100% - 30px), transparent); scrollbar-width: none; }
#cards::-webkit-scrollbar { display: none; }
.card { position: relative; display: flex; flex-direction: column; align-items: center; padding: 8px 8px 12px; border-radius: 22px; color: var(--ink-soft);
  background: linear-gradient(#fff, var(--milk) 50%, var(--milk-lo)); box-shadow: inset 0 0 0 2px rgba(255,255,255,.9), 0 6px 0 var(--milk-deep), 0 12px 16px rgba(20, 30, 50, .18); transition: transform .12s var(--settle); }
.card .pic { position: relative; width: 100%; display: grid; place-items: center; }
/* stage disc with dots behind every pic: shows through translucent skins (Glass Frog reads as glass, not as a missing image) */
.card .pic::before { content: ''; position: absolute; width: 78%; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, rgba(42, 35, 64, .10) 0 2px, transparent 2.5px) 0 0 / 12px 12px, radial-gradient(circle at 50% 40%, #e7f9ff, #c9ecf7 70%); box-shadow: inset 0 -4px 0 rgba(0,0,0,.05); }
.card .pic img, .card .pic svg { position: relative; z-index: 1; width: 88%; height: auto; aspect-ratio: 1; }
.card .pic svg.tsw { aspect-ratio: 1.5; }
.card .nm { font-size: 17px; margin: 2px 0 6px; white-space: nowrap; max-width: 100%; }
.card .tag { position: absolute; top: 8px; left: 8px; z-index: 2; font-size: 11px; padding: 2px 8px; border-radius: 999px; color: #fff; background: var(--berry); box-shadow: 0 2px 0 var(--berry-deep); white-space: nowrap; }

.scrim { position: fixed; inset: 0; background: rgba(15, 40, 45, .3); display: none; place-items: center; z-index: 20; pointer-events: auto; }

.panel { position: relative; width: min(440px, calc(100vw - 32px)); padding: 46px 28px 26px; border-radius: 32px; color: var(--ink-soft); text-align: center;
  background: linear-gradient(#fff, var(--w-tint)); box-shadow: inset 0 0 0 3px rgba(255,255,255,.9), inset 0 7px 0 var(--w-accent), 0 10px 0 var(--milk-deep), 0 24px 40px rgba(10, 30, 40, .3); }

#tryPlay { flex: 2; min-height: 64px; font-size: 26px; }

/* RECORDS */
.recWrap { position: absolute; left: var(--safe-l); right: var(--safe-r); top: 84px; bottom: 16px; display: grid; grid-template-columns: 1fr 280px; gap: 20px; }
#featCards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-content: start; overflow: auto; padding: 4px; scrollbar-width: none; }
.fcard { border-radius: 22px; overflow: hidden; color: var(--ink-soft); background: linear-gradient(#fff, var(--milk-lo)); box-shadow: 0 6px 0 var(--milk-deep), 0 12px 16px rgba(20, 30, 50, .16); text-align: center; }
.fcard .fh { padding: 9px 8px 7px; background: linear-gradient(var(--berry-hi), var(--berry) 60%); color: #fff; font-size: 17px; white-space: nowrap; paint-order: stroke fill; -webkit-text-stroke: 4px var(--berry-deep); }
.fcard .fl { font-size: 13px; padding: 6px 10px 0; opacity: .75; line-height: 1.25; min-height: 38px; }
.fcard .fb { font-size: 22px; padding: 2px 8px; }
.fcard .fx { font-size: 12px; opacity: .6; padding-bottom: 10px; }
.fcard.lock { opacity: .9; }
.fcard.lock .fh { background: linear-gradient(#e6e1ef, var(--lock)); -webkit-text-stroke: 4px var(--lock-deep); }
.fcard.lock .fb { color: rgba(42, 35, 64, .4); font-size: 16px; padding: 6px; }
#lbPanel { width: auto; padding: 46px 18px 18px; align-self: start; margin-top: 26px; }
#lbPanel .sticker { font-size: 26px; }
#lbList { list-style: none; text-align: left; font-size: 17px; counter-reset: r; }
#lbList li { counter-increment: r; display: flex; gap: 8px; padding: 5px 8px; border-radius: 12px; }
#lbList li::before { content: counter(r); width: 26px; color: var(--w-deep); opacity: .6; }
#lbList li:nth-child(odd) { background: rgba(0, 0, 0, .04); }
#lbList li.me { background: var(--sun); }
#lbList li span { margin-left: auto; opacity: .6; }

/* ENDLESS OVER / PAUSE / AD BLOCK */
.center { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--w-deep) 30%, transparent); }
.ovDist { font-size: 84px; line-height: 1; color: var(--w-deep); }
.ovDist small { font-size: 32px; margin-left: 4px; }
.newbest { display: inline-block; margin: 6px 0 2px; padding: 4px 14px; border-radius: 999px; font-size: 20px; color: #fff; background: linear-gradient(var(--berry-hi), var(--berry)); box-shadow: 0 3px 0 var(--berry-deep); transform: rotate(-3deg); animation: dotPulse 1.4s ease-in-out infinite; }
.stats { display: flex; justify-content: center; gap: 10px; margin: 12px 0 18px; }
.stats div { min-width: 76px; padding: 6px 8px; border-radius: 14px; background: rgba(0, 0, 0, .05); }
.stats span { display: block; font-size: 12px; opacity: .6; }
.stats b { font-size: 22px; }
#ovRetry { width: 100%; margin-top: 14px; }
#ovDouble .vid { font-size: 20px; }
#pMeta { font-size: 17px; opacity: .7; margin-bottom: 18px; }
#pause .tg { display: flex; justify-content: center; gap: 14px; margin-top: 4px; }
#block .center { background: rgba(15, 30, 40, .45); }
.spinner { width: 64px; height: 64px; border-radius: 50%; background: conic-gradient(var(--sun) 0 25%, var(--berry) 0 50%, var(--go) 0 75%, #7be0ff 0); animation: rays .9s linear infinite; box-shadow: inset 0 0 0 12px rgba(255,255,255,.85); }

/* LEVEL RESULT */
#resPanel { width: min(480px, calc(100vw - 32px)); padding: 44px 26px 24px; }
.rl { font-size: 17px; opacity: .6; letter-spacing: 1px; }
.rstars { display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; margin: 8px 0 6px; }
.rs { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; color: rgba(42, 35, 64, .45); white-space: nowrap; }
.rs.got { color: var(--ink-soft); }
.rstar { width: 82px; height: 82px; filter: drop-shadow(0 5px 0 rgba(160, 90, 0, .35)); }
.rs:nth-child(2) .rstar { width: 104px; height: 104px; }
.rs:not(.got) .rstar { opacity: .22; filter: grayscale(1) brightness(1.6); }
.rs.got .rstar { opacity: 0; }
.rs.got.hit .rstar { opacity: 1; animation: slam .46s var(--spring) both; }
.done .rs.got.hit .rstar { animation: none; }
@keyframes slam { 0% { transform: translateY(-70px) scale(2.1); opacity: 0; } 45% { transform: translateY(6px) scale(1.18, .78); opacity: 1; } 72% { transform: translateY(-3px) scale(.95, 1.06); } 100% { transform: none; opacity: 1; } }
.rnums { display: flex; justify-content: center; gap: 12px; margin: 6px 0 4px; }
.rnums > div { position: relative; min-width: 128px; padding: 6px 12px 8px; border-radius: 16px; background: rgba(0, 0, 0, .05); }
.rnums span { display: block; font-size: 12px; opacity: .55; }
.rnums b { display: inline-flex; align-items: center; gap: 4px; font-size: 28px; line-height: 1.1; }
.rnums b .i { font-size: 26px; }
.rnums em { position: absolute; right: -10px; top: -12px; font-style: normal; font-size: 12px; padding: 2px 8px; border-radius: 999px; color: #fff; background: var(--berry); box-shadow: 0 2px 0 var(--berry-deep); transform: rotate(6deg); }
.rfeats { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; min-height: 8px; margin: 6px 0 10px; }
.rf { font-size: 13px; padding: 3px 10px; border-radius: 999px; color: #fff; background: linear-gradient(var(--berry-hi), var(--berry)); box-shadow: 0 2px 0 var(--berry-deep); animation: inflate .4s var(--spring) both; }
.ract { display: flex; flex-direction: column; gap: 14px; }
#resNext { width: 100%; }
.ract .row .b { flex: 1; padding: 0 10px; font-size: 19px; }
.lvb > span:first-child { line-height: 1; margin-top: -10px; }
.lvb .st { position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%); display: flex; gap: 1px; }
.lvb .st i { width: 15px; height: 15px; background: rgba(255, 255, 255, .35); clip-path: polygon(50% 0, 63% 35%, 100% 38%, 71% 61%, 81% 100%, 50% 79%, 19% 100%, 29% 61%, 0 38%, 37% 35%); }
.lvb .st i.on { background: #fff6b0; filter: drop-shadow(0 1px 0 rgba(0,0,0,.2)); }
.lvb.cur .st i { background: rgba(160, 100, 0, .25); } .lvb.cur .st i.on { background: #fff; }

/* ---------- HUD ---------- */
#hud { display: none; }
#hud.on { display: block; }
.plate { position: fixed; left: var(--safe-l); top: var(--safe-t); padding: 8px 18px 10px 14px; border-radius: 22px; background: var(--w-glass); pointer-events: none;
  -webkit-backdrop-filter: blur(8px) saturate(1.4); backdrop-filter: blur(8px) saturate(1.4); box-shadow: inset 0 0 0 2px rgba(255,255,255,.7), 0 6px 16px rgba(10, 30, 50, .15); }
.plate .meta { display: flex; gap: 12px; align-items: center; font-size: 17px; white-space: nowrap; }
#hudLevel { height: 24px; padding: 0 10px; border-radius: 999px; background: var(--w-deep); font-size: 15px; display: inline-flex; align-items: center; -webkit-text-stroke: 0; text-shadow: none; }
#hudC { display: inline-flex; gap: 10px; align-items: center; }
#hudScore { font-size: 46px; line-height: 1; margin-top: 2px; }
#combo { position: fixed; left: var(--safe-l); top: calc(var(--safe-t) + 104px); min-height: 42px; padding: 0 16px; font-size: 22px; overflow: hidden; transform-origin: 0 50%; opacity: 0; transition: opacity .2s; pointer-events: none; }
#comboBar { position: absolute; left: 0; bottom: 0; height: 5px; width: 100%; background: rgba(255,255,255,.75); transform-origin: left; }
#prog { position: fixed; left: 50%; top: calc(var(--safe-t) + 14px); width: min(340px, 34vw); height: 22px; transform: translateX(-50%); border-radius: 999px;
  background: var(--w-glass); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); box-shadow: inset 0 0 0 2px rgba(255,255,255,.75); pointer-events: none; }
#progFill { position: absolute; left: 3px; top: 3px; bottom: 3px; right: 3px; border-radius: 999px; background: linear-gradient(#8af5b0, #3fe07c 55%, #22c463); box-shadow: inset 0 -3px 0 rgba(0,0,0,.08); transform-origin: left; transform: scaleX(0); }
#progKnob { position: absolute; top: 50%; left: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #b8ffd0 30%, #3fe07c 70%); box-shadow: 0 2px 0 var(--go-deep), inset 0 0 0 2px #fff; }
#progBest { position: absolute; top: -9px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: radial-gradient(circle, #ffd23f 0 28%, #ff9cbc 32% 100%); box-shadow: 0 2px 0 var(--berry-deep); display: none; }
#prog .goal { position: absolute; right: -24px; top: 50%; width: 40px; height: 40px; margin-top: -20px; }
#hudCoins { position: fixed; right: calc(var(--safe-r) + 66px); top: var(--safe-t); pointer-events: none; }
#pauseBtn { position: fixed; right: var(--safe-r); top: calc(var(--safe-t) - 3px); pointer-events: auto; }
#hint { position: fixed; transform: translate(-50%, -50%); pointer-events: none; display: none; text-align: center; font-size: 24px; animation: hintPulse .8s ease-in-out infinite; }
#hint .hand { width: 40px; height: 40px; margin: 4px auto 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--sun) 60%); box-shadow: 0 3px 0 var(--sun-deep), 0 0 0 5px rgba(255,255,255,.5); }
@keyframes hintPulse { 50% { transform: translate(-50%, -50%) scale(1.1, .94); } }
#popups { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.pp { position: absolute; transform: translate(-50%, -50%); font-size: 26px; white-space: nowrap; animation: pp .9s cubic-bezier(.2,1.6,.4,1) forwards; }
.pp.big { font-size: 54px; -webkit-text-stroke: 9px var(--w-deep); animation-duration: 1.3s; }
.pp.gold { color: var(--sun); } .pp.pink { color: #ffd0e8; }
.pp.red { color: #ff8aa8; font-size: 44px; }
@keyframes pp { 0% { transform: translate(-50%, -50%) scale(.2); opacity: 0; } 18% { transform: translate(-50%, -60%) scale(1.22, .88); opacity: 1; } 30% { transform: translate(-50%, -64%) scale(1); } 75% { opacity: 1; } 100% { transform: translate(-50%, -120%) scale(.85); opacity: 0; } }
#dieText { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 76px; -webkit-text-stroke: 11px var(--w-deep); display: none; pointer-events: none; z-index: 4; }
#dieText.on { display: block; animation: dieIn .36s var(--spring) both; }
@keyframes dieIn { 0% { transform: translate(-50%, -50%) scale(.3, .2); } 60% { transform: translate(-50%, -50%) scale(1.15, .85); } 100% { transform: translate(-50%, -50%); } }

/* achievement praise: capsule banner */
#feat { position: fixed; left: 50%; top: 21%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; z-index: 5; pointer-events: none; }
#feat[hidden] { display: none; }
#feat .shell { position: relative; min-width: 360px; max-width: calc(100vw - 32px); border-radius: 34px; text-align: center; box-shadow: 0 8px 0 var(--berry-deep), 0 20px 30px rgba(80, 10, 40, .3); }
#feat .top { position: relative; padding: 12px 34px 8px; border-radius: 34px 34px 0 0; background: linear-gradient(var(--berry-hi), var(--berry) 60%, var(--berry-lo)); }
#feat .top::before { content: ''; position: absolute; left: 7%; right: 7%; top: 6px; height: 34%; border-radius: 999px; background: linear-gradient(rgba(255,255,255,.7), rgba(255,255,255,0)); }
.ftName { position: relative; font-size: 50px; line-height: 1.05; white-space: nowrap; color: #fff; paint-order: stroke fill; -webkit-text-stroke: 8px var(--berry-deep); text-shadow: 0 4px 0 var(--berry-deep); }
.ftName span { display: inline-block; animation: inflate .42s var(--spring) both; }
@keyframes inflate { 0% { transform: scale(0); } 60% { transform: scale(1.25, .85); } 100% { transform: none; } }
.ftLine { padding: 9px 30px 16px; border-radius: 0 0 34px 34px; background: linear-gradient(#fff, var(--milk-lo)); color: var(--ink-soft); font-size: 18px; border-top: 3px solid rgba(255,255,255,.9); }
#feat .chip { position: absolute; right: -10px; bottom: -30px; transform: rotate(6deg); min-height: 40px; padding: 0 16px; font-size: 22px; animation: inflate .4s var(--spring) .35s both; }
#feat .gl { position: absolute; left: 18px; top: 10px; width: 34px; height: 26px; animation: glint .6s var(--settle) .25s both; }
#feat .gl::before, #feat .gl::after { content: ''; position: absolute; border-radius: 50%; background: #fff; box-shadow: 0 0 10px #fff; }
#feat .gl::before { left: 0; top: 0; width: 15px; height: 15px; } #feat .gl::after { left: 20px; top: 14px; width: 8px; height: 8px; }
@keyframes glint { 0% { transform: scale(0); } 50% { transform: scale(1.6); } 100% { transform: scale(1); } }
#feat.in .shell { animation: drop .5s var(--spring) both; }
#feat.out { animation: deflate .18s var(--deflate) forwards; }
@keyframes deflate { to { transform: translateX(-50%) translateY(-30px) scale(.85); opacity: 0; } }

/* level clear sticker (short celebration before the result screen) */
#clear { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
#clear[hidden] { display: none; }
#clear .sticker { position: absolute; left: 50%; top: 24%; transform: translate(-50%, -50%) rotate(-4deg); font-size: 72px; -webkit-text-stroke: 10px var(--w-deep); animation: dieIn .45s var(--spring) both; }

/* touch tutorial */
#tut { position: fixed; left: 50%; bottom: calc(var(--safe-b) + 22px); transform: translateX(-50%); text-align: center; pointer-events: none; display: none; }
#tut.on { display: block; }
.tutHand { position: relative; width: 84px; height: 84px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 120%, rgba(255,255,255,.35), transparent 60%), var(--w-glass); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.85), 0 8px 18px rgba(10, 30, 50, .25); }
.tutHand svg { width: 46px; height: 46px; color: #fff; filter: drop-shadow(0 3px 0 var(--w-deep)); }
#tut.hold .tutHand { animation: press 1s ease-in-out infinite; }
#tut.let .tutHand { animation: lift .55s var(--settle) infinite; }
@keyframes press { 0%, 100% { transform: scale(1); } 40%, 70% { transform: scale(1.12, .78); box-shadow: inset 0 0 0 3px #fff, 0 0 0 14px rgba(255,255,255,.3); } }
@keyframes lift { from { transform: translateY(0) scale(1.08, .86); } to { transform: translateY(-16px) scale(.96, 1.06); } }
.tutText { font-size: 30px; margin-top: 6px; }

/* coin fly + goo bubbles */
.fly { position: fixed; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; pointer-events: none; z-index: 40; }
.goo { position: fixed; left: 0; top: 0; border-radius: 50%; pointer-events: none; z-index: 39; box-shadow: inset -3px -4px 0 rgba(0,0,0,.08); }
.goo::before { content: ''; position: absolute; left: 22%; top: 16%; width: 30%; height: 24%; border-radius: 50%; background: rgba(255,255,255,.85); }

  #feat { top: 14%; } .ftName { font-size: 34px; -webkit-text-stroke: 6px var(--berry-deep); } .ftLine { font-size: 14px; } #feat .shell { min-width: 280px; }
  #clear .sticker { font-size: 50px; top: 26%; }
  .pp.big { font-size: 38px; -webkit-text-stroke: 7px var(--w-deep); } #dieText { font-size: 54px; }
  #tut { bottom: 8px; } .tutHand { width: 64px; height: 64px; } .tutHand svg { width: 36px; height: 36px; } .tutText { font-size: 22px; }
}

/* ---------- portrait phone ---------- */
@media (orientation: portrait) and (max-width: 600px) {
  .b { min-height: 52px; font-size: 19px; padding: 0 16px; }
  .b.go { min-height: 70px; font-size: 32px; }
  .bub { width: 48px; height: 48px; font-size: 22px; }
  .cap { height: 42px; font-size: 22px; } .cap .i { font-size: 30px; }
  .ttl { font-size: 30px; }
  #menu .wrap { display: flex; flex-direction: column; justify-content: flex-start; padding: 70px 16px 84px; gap: 6px; }
  #menu .col { display: contents; }
  #logo { order: 1; font-size: 74px; margin-bottom: 0; }
  .hero { order: 2; align-self: center; margin: 0 0 4px; } .hero img { width: min(230px, 28vh); margin-bottom: 16px; } .hero .pad { height: 46px; bottom: 30px; } .hero .tag { min-height: 44px; font-size: 15px; }
  #nextUp { order: 3; width: 100%; justify-content: flex-start; margin-top: 4px; } #nextUp .arr { margin-left: auto; }
  #playBtn { order: 4; width: 100%; margin-top: 10px; min-width: 0; }
  #menu .row { order: 5; width: 100%; gap: 10px; margin-top: 10px; } #menu .row .b { flex: 1; padding: 0 8px; }
  .lvBody { top: 74px; } #worldTabs { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .wcard { height: 74px; }
  #levelGrid { grid-template-columns: repeat(4, 64px); gap: 14px 18px; } .lvb { width: 64px; height: 64px; font-size: 24px; } .lvb::before { left: 12px; top: 7px; transform: scale(.8); }
  #shop .body { display: flex; flex-direction: column; top: 72px; bottom: 0; gap: 14px; }
  .show { flex: none; display: grid; grid-template-columns: 136px 1fr; grid-template-rows: auto auto auto 1fr; column-gap: 12px; padding: 12px 14px 14px; align-items: start; justify-items: start; text-align: left; }
  .show .ribbon { grid-column: 2; grid-row: 1; height: 26px; font-size: 13px; }
  .show .spin { grid-column: 1; grid-row: 1 / 5; width: 136px; height: 136px; margin: 0; }
  .show .pedestal { display: none; }
  .show h2 { grid-column: 2; font-size: 26px; margin-top: 4px; } .show .sub { grid-column: 2; font-size: 12px; }
  .show .buy { grid-column: 2; min-height: 50px; font-size: 21px; margin-top: 10px; }
  .side { flex: 1; } .tabs { justify-content: stretch; } .tab { flex: 1; padding: 0 6px; font-size: 16px; min-height: 46px; }
  #cards { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding-bottom: 40px; }
  .card { padding: 4px 4px 10px; border-radius: 18px; } .card .nm { font-size: 14px; } .price { height: 28px; font-size: 15px; }
  .recWrap { display: flex; flex-direction: column; top: 72px; bottom: 0; overflow: auto; } #featCards { grid-template-columns: repeat(2, minmax(0, 1fr)); overflow: visible; }
  #lbPanel { width: 100%; margin: 26px 0 16px; }
  #hudScore { font-size: 34px; } #prog { top: calc(var(--safe-t) + 92px); width: calc(100vw - 80px); } #combo { top: calc(var(--safe-t) + 132px); }
  #feat { top: 26%; } #feat .shell { min-width: 0; width: calc(100vw - 40px); } .ftName { font-size: 38px; } .ftLine { font-size: 15px; padding: 9px 18px 16px; }
  #clear .sticker { font-size: 58px; }
  .rstar { width: 70px; height: 70px; } .rs:nth-child(2) .rstar { width: 88px; height: 88px; } .rnums > div { min-width: 0; flex: 1; }
  .lvb .st i { width: 12px; height: 12px; } .lvb .st { bottom: 6px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
