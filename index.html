<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Sticky Frog</title>
<link rel="icon" href="data:," />
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
:root { --pink: #ff6fb5; --green: #2ecc71; --dgreen: #1f8f4e; --yellow: #ffd23f; --ink: #1d2b3a; --font: 'Arial Black', 'Segoe UI Black', system-ui, sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #a8e6ff; font-family: var(--font); color: #fff;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.ov { position: fixed; inset: 0; pointer-events: none; }
#vignette { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,20,30,0.38) 100%); }
#flash { background: #fff; opacity: 0; }
.stroke { text-shadow: 0 3px 0 rgba(0,0,0,.35), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink); }
.screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; }
.screen.on { display: flex; }
.btn { font-family: var(--font); font-size: 26px; color: #fff; border: 0; border-radius: 999px; padding: 14px 34px; min-height: 56px; min-width: 56px; cursor: pointer;
  background: linear-gradient(#ff8cc6, var(--pink)); box-shadow: 0 6px 0 #c2407f, 0 10px 18px rgba(0,0,0,.25); letter-spacing: 1px;
  transition: transform .12s cubic-bezier(.3,1.8,.5,1), filter .12s; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
.btn:hover { transform: scale(1.07) rotate(-1deg); filter: brightness(1.08); }
.btn:active { transform: scale(.93); box-shadow: 0 2px 0 #c2407f; }
.btn.green { background: linear-gradient(#5be08f, var(--green)); box-shadow: 0 6px 0 var(--dgreen), 0 10px 18px rgba(0,0,0,.25); }
.btn.green:active { box-shadow: 0 2px 0 var(--dgreen); }
.btn.gray { background: linear-gradient(#8fa3b8, #6b8099); box-shadow: 0 6px 0 #48596d, 0 10px 18px rgba(0,0,0,.2); }
.btn.small { font-size: 18px; padding: 10px 20px; }
.btn.big { font-size: 40px; padding: 16px 62px; }
.icon { width: 56px; height: 56px; padding: 0; font-size: 24px; }
#menu { justify-content: flex-start; padding-top: 6vh; }
#logo { position: relative; text-align: center; line-height: .9; animation: bob 2.4s ease-in-out infinite; }
#logo .a, #logo .b { display: block; font-size: min(15vw, 120px); letter-spacing: 2px; paint-order: stroke; -webkit-text-stroke: 10px var(--ink); }
#logo .a { color: var(--yellow); transform: rotate(-4deg); }
#logo .b { color: var(--green); transform: rotate(3deg) translateX(18px); }
@keyframes bob { 50% { transform: translateY(-8px) rotate(1deg); } }
#menu .col { display: flex; flex-direction: column; gap: 18px; align-items: center; margin-top: 3vh; }
#menu .row { display: flex; gap: 16px; }
#menuTip { margin-top: 2vh; font-size: 18px; opacity: .95; }
.coins { position: fixed; top: 14px; right: 16px; font-size: 26px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
.coin { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff6a0, #ffc400 60%, #c98a00); border: 3px solid var(--ink); display: inline-block; }
.toggles { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 10px; }
.panel { background: linear-gradient(#ffffff, #eafff2); color: var(--ink); border-radius: 28px; border: 5px solid var(--ink); box-shadow: 0 12px 0 rgba(0,0,0,.2); padding: 22px 30px; text-align: center; max-width: 92vw; max-height: 92vh; overflow: auto; }
.pop { animation: pop .45s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes pop { from { transform: scale(.3) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
.title { font-size: 44px; color: var(--yellow); paint-order: stroke; -webkit-text-stroke: 8px var(--ink); margin-bottom: 8px; }
.hdr { position: fixed; top: 12px; left: 16px; display: flex; gap: 14px; align-items: center; }
.tabs { display: flex; gap: 10px; margin: 70px 0 14px; flex-wrap: wrap; justify-content: center; }
.tab { font-family: var(--font); font-size: 18px; border: 4px solid var(--ink); border-radius: 16px; padding: 8px 16px; background: #fff; color: var(--ink); cursor: pointer; min-height: 56px; transition: transform .12s; }
.tab.on { background: var(--yellow); transform: scale(1.08); }
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; padding: 0 16px 16px; max-width: 760px; width: 100%; overflow: auto; }
.lvl { position: relative; aspect-ratio: 1.25; border-radius: 18px; border: 4px solid var(--ink); background: linear-gradient(#5be08f, var(--green)); font-size: 30px; color: #fff; cursor: pointer; font-family: var(--font); transition: transform .12s cubic-bezier(.3,1.8,.5,1); min-height: 56px; }
.lvl:hover { transform: scale(1.08); } .lvl:active { transform: scale(.94); }
.lvl.locked { background: #9aa8b5; cursor: default; color: #dde3ea; }
.lvl .st { position: absolute; bottom: 4px; left: 0; right: 0; font-size: 14px; letter-spacing: 1px; }
.on-star { color: var(--yellow); } .off-star { color: rgba(0,0,0,.25); }
#shop { align-items: flex-start; padding-left: 3vw; } #shop .tabs { margin-left: 0; }
#shop .cards { max-width: min(600px, 66vw); padding: 0 0 16px; max-height: calc(100vh - 150px); grid-auto-rows: min-content; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; padding: 0 16px 16px; max-width: 900px; width: 100%; overflow: auto; }
.card { background: #fff; color: var(--ink); border: 4px solid var(--ink); border-radius: 20px; padding: 10px; text-align: center; cursor: pointer; transition: transform .12s cubic-bezier(.3,1.8,.5,1); min-height: 56px; font-family: var(--font); }
.card:hover { transform: translateY(-4px) scale(1.04); }
.card.eq { background: #fff7c2; box-shadow: 0 0 0 4px var(--yellow); }
.card .nm { font-size: 15px; margin: 6px 0 4px; } .card .pr { font-size: 15px; display: flex; gap: 6px; justify-content: center; align-items: center; }
.card .pr .coin { width: 18px; height: 18px; border-width: 2px; }
.swatch { width: 70px; height: 56px; margin: 0 auto; border-radius: 50% 50% 44% 44%; border: 4px solid var(--ink); position: relative; }
.swatch::before, .swatch::after { content: ''; position: absolute; top: -10px; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle, #111 30%, #fff 34%); border: 3px solid var(--ink); }
.swatch::before { left: 4px; } .swatch::after { right: 4px; }
.tswatch { height: 26px; border-radius: 13px; border: 4px solid var(--ink); margin: 14px 4px; }
#hud { display: none; }
#hud.on { display: block; }
#hudL { position: fixed; top: 12px; left: 16px; font-size: 22px; line-height: 1.15; }
#hudL .score { font-size: 34px; }
#hudC { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); font-size: 24px; display: flex; gap: 22px; align-items: center; }
.flyico { display: inline-block; width: 18px; height: 18px; background: #222; border-radius: 50%; border: 3px solid #fff; vertical-align: -2px; margin-right: 6px; box-shadow: -7px -7px 0 -3px rgba(230,248,255,.9), 7px -7px 0 -3px rgba(230,248,255,.9); }
#prog { position: fixed; top: 52px; left: 50%; width: 240px; margin-left: -120px; height: 10px; border-radius: 5px; background: rgba(0,0,0,.25); border: 2px solid var(--ink); overflow: hidden; }
#prog i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(90deg, #5be08f, var(--yellow)); transform-origin: left; transform: scaleX(0); }
#prog b { position: absolute; top: -2px; bottom: -2px; width: 3px; background: #fff; left: 0; display: none; }
#pauseBtn { position: fixed; top: 10px; right: 12px; pointer-events: auto; }
#combo { position: fixed; top: 92px; left: 16px; font-size: 28px; color: var(--yellow); transform-origin: left center; opacity: 0; transition: opacity .2s; }
#combo .bar { height: 8px; width: 120px; border-radius: 4px; background: rgba(0,0,0,.25); border: 2px solid var(--ink); margin-top: 4px; overflow: hidden; }
#combo .bar i { display: block; height: 100%; background: var(--yellow); width: 100%; }
#hint { position: fixed; font-size: 26px; transform: translate(-50%, -50%); pointer-events: none; display: none; text-align: center; animation: pulse .8s ease-in-out infinite; }
#hint .hand { width: 46px; height: 46px; margin: 6px auto 0; border-radius: 50%; border: 5px solid #fff; background: rgba(255,111,181,.6); box-shadow: 0 0 0 4px var(--ink); }
@keyframes pulse { 50% { transform: translate(-50%, -50%) scale(1.12); } }
#popups { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.pp { position: absolute; transform: translate(-50%, -50%); font-size: 26px; white-space: nowrap; animation: pp .9s cubic-bezier(.2,1.6,.4,1) forwards; }
.pp.big { font-size: 54px; color: var(--yellow); paint-order: stroke; -webkit-text-stroke: 9px var(--ink); text-shadow: 0 6px 0 rgba(0,0,0,.3); animation-duration: 1.3s; }
.pp.pink { color: #ffd0e8; } .pp.gold { color: var(--yellow); } .pp.red { color: #ff5a5a; font-size: 46px; paint-order: stroke; -webkit-text-stroke: 8px var(--ink); }
@keyframes pp { 0% { transform: translate(-50%, -50%) scale(.2); opacity: 0; } 18% { transform: translate(-50%, -60%) scale(1.25); opacity: 1; } 30% { transform: translate(-50%, -64%) scale(1); } 75% { opacity: 1; } 100% { transform: translate(-50%, -120%) scale(.9); opacity: 0; } }
#result .stars { display: flex; justify-content: center; gap: 10px; margin: 8px 0 12px; height: 92px; }
.bigstar { font-size: 84px; line-height: 1; color: rgba(0,0,0,.15); transform: scale(1); }
.bigstar.got { color: var(--yellow); -webkit-text-stroke: 5px var(--ink); animation: slam .45s cubic-bezier(.2,1.8,.4,1) both; }
.bigstar:nth-child(2) { transform: translateY(-14px); }
@keyframes slam { from { transform: scale(3) rotate(-30deg); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.stats { display: grid; grid-template-columns: auto auto; gap: 4px 26px; font-size: 20px; margin: 4px auto 12px; text-align: left; width: max-content; }
.stats b { text-align: right; }
.stats .miss { color: #c0392b; }
.earn { font-size: 30px; display: flex; gap: 8px; justify-content: center; align-items: center; margin-bottom: 14px; }
.btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
#shopBtn { position: relative; }
#shopBtn.badge::after { content: '!'; position: absolute; top: -8px; right: -8px; width: 30px; height: 30px; border-radius: 50%; background: #ff3b3b; border: 3px solid var(--ink); font-size: 18px; line-height: 24px; animation: pulse2 .6s ease-in-out infinite; }
.newbest { color: #ff3b8d; font-size: 22px; animation: pulse2 .6s ease-in-out infinite; }
@keyframes pulse2 { 50% { transform: scale(1.12); } }
.vid { display: inline-block; width: 0; height: 0; border-left: 14px solid #fff; border-top: 9px solid transparent; border-bottom: 9px solid transparent; margin-right: 8px; vertical-align: 0; }
#block { background: rgba(0,0,0,.5); font-size: 28px; z-index: 50; }
#dieText { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 72px; color: #fff; paint-order: stroke; -webkit-text-stroke: 10px var(--ink); display: none; pointer-events: none; }
#dieText.on { display: block; animation: pop .3s cubic-bezier(.3,1.8,.5,1) both; }
@media (max-height: 460px) {
  #logo .a, #logo .b { font-size: 50px; -webkit-text-stroke: 6px var(--ink); }
  #logo .b { transform: rotate(3deg) translateX(12px); }
  #menu { padding-top: 10px; } #menu .col { gap: 10px; margin-top: 14px; } .btn.big { font-size: 28px; padding: 8px 44px; }
  .pp.big { font-size: 38px; -webkit-text-stroke: 7px var(--ink); }
  /* 結算：統計改四欄（兩組一列）、星星縮小，按鈕一列不用捲動 */
  #resultPanel { padding: 8px 20px 10px; max-height: none; overflow: visible; }
  .title { font-size: 26px; margin-bottom: 0; } .bigstar { font-size: 42px; } .bigstar.got { -webkit-text-stroke: 4px var(--ink); } .bigstar:nth-child(2) { transform: translateY(-6px); }
  #result .stars { height: 46px; margin: 0 0 2px; gap: 6px; } #resBest, #resUnlock { font-size: 15px; }
  .stats { grid-template-columns: auto auto auto auto; gap: 1px 12px; font-size: 14px; margin: 2px auto 4px; }
  .stats small { font-size: 11px; } .earn { font-size: 20px; margin-bottom: 6px; } .earn .coin { width: 20px; height: 20px; }
  #result .btns { flex-wrap: nowrap; gap: 10px; } #result .btn { font-size: 18px; padding: 8px 18px; }
  .panel { padding: 12px 22px; }
  .tabs { margin-top: 76px; margin-bottom: 8px; } .tab { min-height: 56px; padding: 6px 14px; font-size: 16px; } .lvl { aspect-ratio: 2.4; font-size: 22px; }
  /* 商店：5 欄 × 2 列放得下 9 隻，不用捲也不會切到 */
  #shop .cards { grid-template-columns: repeat(5, minmax(0, 1fr)); max-width: 74vw; gap: 6px; max-height: calc(100vh - 146px); grid-auto-rows: min-content; }
  .card { padding: 4px 3px; border-radius: 12px; border-width: 3px; min-height: 56px; } .card .nm { font-size: 11px; margin: 2px 0 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .card .pr { font-size: 11px; }
  .swatch { width: 40px; height: 30px; border-width: 3px; } .swatch::before, .swatch::after { width: 14px; height: 14px; top: -7px; border-width: 2px; } .tswatch { margin: 8px 4px; height: 20px; } #hudL .score { font-size: 26px; } #combo { top: 76px; }
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette" class="ov"></div>
<div id="popups"></div>
<div id="dieText" class="stroke"></div>

<div id="hud">
  <div id="hudL" class="stroke"><div id="hudLevel">LEVEL 1-1</div><div class="score" id="hudScore">0</div></div>
  <div id="combo" class="stroke"><span id="comboN">x2</span> COMBO<div class="bar"><i id="comboBar"></i></div></div>
  <div id="hudC" class="stroke"><span><span class="flyico"></span><span id="hudFlies">0/0</span></span><span id="hudTime">0.0s</span></div>
  <div id="prog"><i id="progFill"></i><b id="progBest"></b></div>
  <button id="pauseBtn" class="btn icon gray" aria-label="Pause">II</button>
  <div id="hint" class="stroke"><span id="hintText">HOLD</span><div class="hand"></div></div>
</div>

<div id="menu" class="screen">
  <div class="coins stroke"><span class="coin"></span><span class="coinN">0</span></div>
  <div id="logo"><span class="a">STICKY</span><span class="b">FROG</span></div>
  <div class="col">
    <button id="playBtn" class="btn big green">PLAY</button>
    <div class="row"><button id="levelsBtn" class="btn">LEVELS</button><button id="shopBtn" class="btn">FROGS</button></div>
  </div>
  <div id="menuTip" class="stroke">HOLD to lick &middot; RELEASE to fly</div>
  <div class="toggles"><button class="btn icon gray musicT" aria-label="Music">&#9835;</button><button class="btn icon gray sfxT" aria-label="Sound">&#9834;</button></div>
</div>

<div id="levels" class="screen">
  <div class="hdr"><button class="btn small gray back">&larr; BACK</button><span class="stroke" style="font-size:28px">LEVELS</span><span id="starTotal" class="stroke" style="font-size:22px;color:var(--yellow)"></span></div>
  <div class="coins stroke"><span class="coin"></span><span class="coinN">0</span></div>
  <div class="tabs" id="worldTabs"></div>
  <div class="grid" id="levelGrid"></div>
</div>

<div id="shop" class="screen">
  <div class="hdr"><button class="btn small gray back">&larr; BACK</button><span class="stroke" style="font-size:28px">FROGS</span></div>
  <div class="coins stroke"><span class="coin"></span><span class="coinN">0</span></div>
  <div class="tabs"><button class="tab on" data-t="skins">FROGS</button><button class="tab" data-t="trails">TRAILS</button></div>
  <div class="cards" id="cards"></div>
</div>

<div id="result" class="screen">
  <div class="panel pop" id="resultPanel">
    <div class="title" id="resTitle">LEVEL CLEAR!</div>
    <div class="stars"><span class="bigstar">&#9733;</span><span class="bigstar">&#9733;</span><span class="bigstar">&#9733;</span></div>
    <div id="resBest" class="newbest" style="display:none">NEW BEST!</div>
    <div id="resUnlock" class="newbest" style="display:none;color:#1f8f4e"></div>
    <div class="stats" id="resStats"></div>
    <div class="earn"><span class="coin"></span>+<span id="resCoins">0</span></div>
    <div class="btns"><button id="resMenu" class="btn small gray">MENU</button><button id="resRetry" class="btn small">RETRY</button><button id="resDouble" class="btn small" style="display:none"><span class="vid"></span>x2 COINS</button><button id="resNext" class="btn green">NEXT &rarr;</button></div>
  </div>
</div>

<div id="pause" class="screen" style="background:rgba(10,30,40,.45)">
  <div class="panel pop">
    <div class="title">PAUSED</div>
    <div class="btns" style="flex-direction:column;align-items:center">
      <button id="resumeBtn" class="btn green big">RESUME</button>
      <div class="btns"><button id="pRestart" class="btn small">RESTART</button><button id="pLevels" class="btn small">LEVELS</button><button id="pMenu" class="btn small gray">MENU</button></div>
      <div class="btns"><button class="btn icon gray musicT" aria-label="Music">&#9835;</button><button class="btn icon gray sfxT" aria-label="Sound">&#9834;</button></div>
    </div>
  </div>
</div>

<div id="block" class="screen stroke">...</div>
<div id="flash" class="ov"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
