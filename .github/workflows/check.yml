# 同一套 devenv 環境在 CI 裡跑 devenv test（型別、lint、規則測試、建置、收資料端測試）。
# 依據：devenv.sh/integrations/github-actions；concurrency 寫法見 docs.github.com control-workflow-concurrency。
name: check
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
# 同一個 PR 連推只保留最新的一次；main 與 dev 的每個提交都要完整跑完，不取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Install dependencies
        run: devenv shell -- bun install --frozen-lockfile
      - name: devenv test
        run: devenv test --no-tui
