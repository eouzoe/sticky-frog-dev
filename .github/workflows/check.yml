# 同一套 devenv 環境在 CI 裡跑 devenv test（型別、lint、遊戲規則檢查、建置、收資料端測試）。手動觸發：gh workflow run check.yml --ref <branch>
name: check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Install dependencies
        run: devenv shell -- bun install --frozen-lockfile
      - name: devenv test
        run: devenv test
