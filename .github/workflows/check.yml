# Continuous integration: typecheck, lint, the check scripts, the telemetry server tests and a production build.
# Manual only: run it once at the end of each batch (gh workflow run check.yml --ref <branch>), not on every push.
name: check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: typecheck, lint, tests/*-check.mjs
        run: bun run check
      - name: telemetry server (Vitest in workerd)
        working-directory: server/telemetry
        run: npm ci && npm test
      - name: build
        run: bun run build
